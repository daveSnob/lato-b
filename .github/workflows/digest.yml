name: Aggiorna Lato B

on:
  schedule:
    - cron: "0 5,17 * * *"   # 07:00 e 19:00 ora italiana (estate); 06:00 e 18:00 d'inverno
  workflow_dispatch:          # pulsante "Run workflow" per aggiornare a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ultimi post [FRESH] scaricati: servono se Reddit non risponde
      - uses: actions/cache@v4
        with:
          path: fresh-cache.json
          key: fresh-${{ github.run_id }}
          restore-keys: fresh-
      - run: node digest.mjs
      - run: mkdir -p _site && cp lato-b.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
